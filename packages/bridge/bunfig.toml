# bun test configuration (issue #128)
#
# Preload redirects XDG_RUNTIME_DIR to a per-run tmpdir before any bridge
# module loads, so test socket creation (vault.sock / pat.sock) never
# lands in the live bridge's XDG_RUNTIME_DIR. Keep the preload wired
# here: the regression test (channel/socket-isolation.test.ts) fails
# when it is not active.
[test]
preload = ["./test/xdg-isolation.ts"]
