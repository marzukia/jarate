[project]
name = "detpipe"
version = "0.1.0"
description = "Deterministic handoff generator (zero LLM) — operator order 2026-10-27"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
