name: ci

on:
  pull_request:
  push:
    branches: [main]

# CI wall fix (2026-10-05, monky ranked fixes 2+5): the marzukia Free-plan
# account cap is 20 concurrent hosted jobs across all repos; dispatch waves
# of 6-8 PR runs x 5 jobs queue beyond it and queued jobs get cancelled at
# ~15 min. Same-ref cancel-in-progress frees slots for the newest code;
# per-job timeout-minutes stops a hung job holding a slot for hours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Fork-PR code never runs on the home lab: PR jobs -> ubuntu-latest,
# push:main -> nf.

jobs:
  biome:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'nf' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Biome check
        run: bunx biome check .

  bridge:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'nf' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: cd packages/bridge && bun install
      - name: Typecheck
        run: cd packages/bridge && bun x tsc --noEmit
      - name: Test
        run: cd packages/bridge && bun x bun test

  recall:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'nf' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: cd packages/recall && bun install
      - name: Typecheck
        run: cd packages/recall && bun x tsc --noEmit
      - name: Test
        # integration tests skip when Postgres/Ollama are unreachable
        run: cd packages/recall && bun test

  bin:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'nf' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Test
        # needs jq, rg, python3 (all in the ubuntu image)
        run: cd bin && bun test

  test:  # job name satisfies branch-protection required check "test"
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'nf' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install bridge deps
        # dispatch tests import bridge predicates (isBgWebhook, #159 A1)
        run: cd packages/bridge && bun install
      - name: Test
        run: cd dispatch && bun test
