name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Biome check
        run: bunx biome check .

  piscord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: cd piscord && bun install
      - name: Typecheck
        run: cd piscord && bun x tsc --noEmit
      - name: Test
        run: cd piscord && bun x bun test
